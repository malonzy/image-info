name: Deploy Vite App

on:
  push:
    branches:
      - runner

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Restart PM2 application
        run: |
          pm2 restart vite-app || pm2 start "npm run preview -- --host 0.0.0.0 --port 4173" --name vite-app
          pm2 save

name: deployment

on:
  push:
    branches: [prod]

jobs:
  build:
    name: Build App
    runs-on: self-hosted

    steps:        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Run app
        run: npx serve dist
